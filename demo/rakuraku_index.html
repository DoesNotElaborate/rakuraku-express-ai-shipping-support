<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RakuRaku Express | Synthetic policy demo</title>
<style>body{font:16px system-ui;background:#f5f8fc;color:#183046;margin:0}header{background:#123c57;color:white;padding:24px 5vw}main{max-width:1100px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:750px){.grid{grid-template-columns:1fr}}section{background:white;border:1px solid #dce6ee;border-radius:14px;padding:22px;box-shadow:0 4px 16px #123c5710}label{display:block;font-weight:600;margin:12px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aabdc9;border-radius:7px;font:inherit}textarea{min-height:110px}button{background:#137a78;border:0;border-radius:7px;color:white;font:inherit;padding:12px 18px;margin-top:18px;cursor:pointer}.sub{color:#d5eef0}.notice{background:#fff3d6;padding:12px;border-radius:8px}.passage{border-top:1px solid #dde5eb;padding:10px 0}pre{white-space:pre-wrap;font:inherit}</style>
<header><h1>RakuRaku Express</h1><div class="sub">AI Shipping Support Agent · synthetic classroom policy</div></header><main><p class="notice">Drafting aid only. No external messages, refunds, ticket changes, or real customer data. Human approval required.</p><div class="grid"><section><h2>Fictional case</h2><form id="case"><label>Customer question</label><textarea name="question">Shipment RX-1001 was standard, picked up Monday June 1, 2026 and destination scanned Thursday June 4. I wrote Friday June 5. Shipping was $80. Am I eligible for a credit?</textarea><label>Service</label><select name="service"><option>standard</option><option>expedited</option><option>international</option></select><label>Pickup date</label><input name="pickup" type="date" value="2026-06-01"><label>Destination delivery scan date</label><input name="delivery" type="date" value="2026-06-04"><label>Written notice date</label><input name="notice" type="date" value="2026-06-05"><label>Transportation charge ($)</label><input name="charge" type="number" step=".01" value="80"><label>Requested refund ($, optional)</label><input name="requested_refund" type="number" step=".01"><label><input name="carrier_scan" type="checkbox" checked style="width:auto"> Carrier destination scan verified</label><label><input name="holiday_calendar_verified" type="checkbox" checked style="width:auto"> Holiday calendar verified; no holidays in range</label><label><input name="order_confirmation" type="checkbox" style="width:auto"> International order confirmation verified</label><label><input name="wrong_address" type="checkbox" style="width:auto"> Customer entered incorrect address</label><label><input name="weather" type="checkbox" style="width:auto"> Weather exception raised</label><label><input name="legal_or_fraud" type="checkbox" style="width:auto"> Legal, injury, litigation, or fraud concern</label><button>Retrieve and draft</button></form></section><section><h2>Grounded response</h2><div id="mode">Run a fictional case to see the retrieval result.</div><pre id="answer"></pre><h3>Retrieved policy sections</h3><div id="passages"></div></section></div></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),c=Object.fromEntries(f);for(let n of ['carrier_scan','holiday_calendar_verified','order_confirmation','wrong_address','weather','legal_or_fraud'])c[n]=f.has(n);c.holidays=[];if(!c.requested_refund)c.requested_refund=null;let out=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)}).then(x=>x.json());document.querySelector('#mode').textContent=out.mode||out.error;document.querySelector('#answer').textContent=out.answer||'';document.querySelector('#passages').replaceChildren(...(out.passages||[]).map(p=>{let d=document.createElement('div');d.className='passage';d.textContent='Rule/Section '+p.section+': '+p.text;return d}))};</script></html>
